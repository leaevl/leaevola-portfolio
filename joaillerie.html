<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joaillerie | Lea Evola</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap');
        
        :root { --bg: #111111; --text: #ffffff; --accent: #E52A2A; --gray: #aaaaaa; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 2rem 4rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #222; }
        header a { color: var(--text); text-decoration: none; margin-left: 2rem; transition: color 0.3s; }
        header a:hover { color: var(--accent); }
        
        .gallery-header { text-align: center; margin: 4rem 0 2rem 0; }
        .gallery-header h1 { font-weight: 800; font-size: 2.5rem; text-transform: uppercase; letter-spacing: -1px; }
        
        .portfolio-section { max-width: 1200px; margin: 0 auto 6rem auto; padding: 0 2rem; width: 100%; flex: 1; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; width: 100%; }
        .portfolio-grid img { width: 100%; height: 350px; object-fit: cover; border-radius: 4px; transition: transform 0.3s ease; }
        .portfolio-grid img:hover { transform: scale(1.02); }
        
        footer { width: 100%; padding: 2rem 0; text-align: center; font-size: 0.85rem; color: var(--gray); border-top: 1px solid #222; }
        footer a { color: var(--gray); text-decoration: underline; font-size: 0.75rem; transition: color 0.3s; }
        footer a:hover { color: var(--accent); }

        @media (max-width: 850px) {
            header { padding: 1.5rem; flex-direction: column; gap: 1rem; text-align: center; }
            header nav { display: flex; gap: 2rem; }
            header nav a { margin: 0; }
            .portfolio-grid img { height: 250px; }
        }
    </style>
</head>
<body>
    <header role="banner">
        <a href="index.html" style="display: flex; align-items: center;">
            <img src="Logo VF Blanc2.png" alt="Lea Evola Logo" style="height: 50px; object-fit: contain;">
        </a>
        <nav aria-label="Menu principal">
            <a href="index.html" style="color: var(--accent);">PORTFOLIO</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>

    <div class="gallery-header">
        <h1>JOAILLERIE</h1>
    </div>

    <section class="portfolio-section">
        <div class="portfolio-grid">
            <img src="2526-B3-EVOLA_Lea_1.jpg" alt="Joaillerie">
            <img src="2526-B3-EVOLA_Lea_2.jpg" alt="Joaillerie">
            <img src="2526-B3-EVOLA_Lea_3.jpg" alt="Joaillerie">
            <img src="2526-B3-EVOLA_Lea_4.jpg" alt="Joaillerie">
            <img src="2526-B3-EVOLA_Lea_5.jpg" alt="Joaillerie">
            <img src="2526-B3-EVOLA_Lea_6.jpg" alt="Joaillerie">
            <img src="2526-B3-EVOLA_Lea_7.jpg" alt="Joaillerie">
            <img src="2526-B3-EVOLA_Lea_8.jpg" alt="Joaillerie">
            <img src="2526-B3-EVOLA_Lea_9.jpg" alt="Joaillerie">
        </div>
    </section>

    <footer>
        <div style="margin-bottom: 0.5rem;">© 2026 LEA EVOLA — Photographe</div>
        <div><a href="legales.html">Mentions légales & Politique de confidentialité</a></div>
    </footer>
</body>
</html>
